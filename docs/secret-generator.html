<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; font-src 'none'; base-uri 'none'; form-action 'none'"
  >
  <meta name="referrer" content="no-referrer">
  <title>SYNCIO Secret Generator</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f5f7f6;
      --surface: #ffffff;
      --text: #18201d;
      --muted: #5d6964;
      --border: #cad2ce;
      --accent: #19724e;
      --accent-hover: #125b3e;
      --secondary: #e7ece9;
      --focus: #e6a700;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111513;
        --surface: #191f1c;
        --text: #edf2ef;
        --muted: #aab6b0;
        --border: #3a4640;
        --accent: #6fc89d;
        --accent-hover: #8bd8b2;
        --secondary: #28312d;
        --focus: #f5c84c;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--page);
      color: var(--text);
      font: 16px/1.5 system-ui, sans-serif;
    }
    main {
      width: min(720px, calc(100% - 32px));
      margin: 0 auto;
      padding: 48px 0;
    }
    header { margin-bottom: 28px; }
    h1, h2, p { margin-top: 0; }
    h1 { margin-bottom: 4px; font-size: clamp(1.8rem, 8vw, 2.6rem); letter-spacing: 0; }
    h2 { margin-bottom: 6px; font-size: 1.05rem; letter-spacing: 0; }
    .subtitle, .hint, .privacy { color: var(--muted); }
    .generator {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
    }
    .secret {
      padding: 22px;
    }
    .secret + .secret { border-top: 1px solid var(--border); }
    .field-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      margin-top: 14px;
    }
    input {
      width: 100%;
      min-width: 0;
      height: 44px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--page);
      color: var(--text);
      padding: 0 12px;
      font: 0.9rem/1.2 ui-monospace, monospace;
      letter-spacing: 0;
    }
    button {
      min-height: 44px;
      border: 0;
      border-radius: 6px;
      background: var(--accent);
      color: #ffffff;
      padding: 0 18px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: var(--accent-hover); }
    button:focus-visible, input:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }
    .secondary {
      background: var(--secondary);
      color: var(--text);
    }
    .secondary:hover { background: var(--border); }
    .privacy {
      margin: 22px 0 0;
      font-size: 0.9rem;
    }
    .status {
      min-height: 24px;
      margin: 12px 0 0;
      color: var(--accent);
      font-weight: 700;
    }
    @media (max-width: 560px) {
      main { padding: 28px 0; }
      .field-row { grid-template-columns: 1fr; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>SYNCIO</h1>
      <p class="subtitle">Deploy secret generator</p>
    </header>

    <section class="generator" aria-label="Generated deployment secrets">
      <div class="secret">
        <h2>1. Encryption key</h2>
        <p class="hint">Paste this into <strong>SYNCIO_ENCRYPTION_KEY</strong>.</p>
        <div class="field-row">
          <input id="encryption-key" type="password" readonly aria-label="SYNCIO encryption key">
          <button type="button" data-copy="encryption-key">Copy</button>
        </div>
      </div>

      <div class="secret">
        <h2>2. Setup token</h2>
        <p class="hint">Paste this into <strong>SYNCIO_SETUP_TOKEN</strong>.</p>
        <div class="field-row">
          <input id="setup-token" type="password" readonly aria-label="SYNCIO setup token">
          <button type="button" data-copy="setup-token">Copy</button>
        </div>
      </div>
    </section>

    <div class="actions">
      <button id="toggle" class="secondary" type="button">Show values</button>
      <button id="regenerate" class="secondary" type="button">Generate new values</button>
    </div>
    <p id="status" class="status" aria-live="polite"></p>
    <p class="privacy">
      Generated only in this browser using Web Crypto. This page makes no network requests.
      Save both values in a password manager before closing it.
    </p>
  </main>

  <script>
    const fields = [
      document.getElementById("encryption-key"),
      document.getElementById("setup-token")
    ];
    const status = document.getElementById("status");
    const toggle = document.getElementById("toggle");

    function randomSecret() {
      const bytes = new Uint8Array(48);
      crypto.getRandomValues(bytes);
      let binary = "";
      for (const byte of bytes) binary += String.fromCharCode(byte);
      return btoa(binary);
    }

    function generate() {
      fields[0].value = randomSecret();
      fields[1].value = randomSecret();
      status.textContent = "Two independent values are ready.";
    }

    async function copyField(id, button) {
      const field = document.getElementById(id);
      try {
        await navigator.clipboard.writeText(field.value);
      } catch {
        field.type = "text";
        field.select();
        document.execCommand("copy");
        field.type = toggle.dataset.visible === "true" ? "text" : "password";
      }
      status.textContent = id === "encryption-key" ? "Encryption key copied." : "Setup token copied.";
      const label = button.textContent;
      button.textContent = "Copied";
      setTimeout(() => { button.textContent = label; }, 1200);
    }

    document.querySelectorAll("[data-copy]").forEach((button) => {
      button.addEventListener("click", () => copyField(button.dataset.copy, button));
    });

    toggle.addEventListener("click", () => {
      const visible = toggle.dataset.visible !== "true";
      toggle.dataset.visible = String(visible);
      fields.forEach((field) => { field.type = visible ? "text" : "password"; });
      toggle.textContent = visible ? "Hide values" : "Show values";
    });

    document.getElementById("regenerate").addEventListener("click", () => {
      if (window.confirm("Replace both generated values?")) generate();
    });

    generate();
  </script>
</body>
</html>
